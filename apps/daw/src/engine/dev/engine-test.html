<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engine test</title>
    <style>
      body { font: 15px system-ui, sans-serif; margin: 24px; max-width: 560px; }
      button { font: inherit; padding: 6px 12px; margin: 0 6px 6px 0; }
      label { display: grid; grid-template-columns: 140px 1fr 60px; align-items: center; gap: 8px; margin: 8px 0; }
      #meter { height: 10px; background: #2a7; width: 0; transition: width 50ms linear; }
      #meterbox { border: 1px solid #999; height: 10px; margin: 12px 0; }
      code { background: #eee; padding: 0 4px; }
    </style>
  </head>
  <body>
    <h1>Engine test (P3)</h1>
    <p>A test-tone plugin (one sine voice, C3) loads through the engine and plays through its strip into Master.</p>
    <p>Status: <code id="status">…</code></p>
    <div>
      <button id="note">Play C3 (0.5 s)</button>
      <button id="hold">Hold C3</button>
      <button id="release">Release</button>
    </div>
    <label>Volume <input id="gain" type="range" min="0" max="1.5" step="0.01" value="1" /><span id="gainv">1.00</span></label>
    <label>Pan <input id="pan" type="range" min="-1" max="1" step="0.01" value="0" /><span id="panv">0.00</span></label>
    <label>Master volume <input id="mgain" type="range" min="0" max="1.5" step="0.01" value="1" /><span id="mgainv">1.00</span></label>
    <div>
      <button id="remove">Remove node</button>
      <button id="add">Add node</button>
    </div>
    <div id="meterbox"><div id="meter"></div></div>
    <p>Master RMS: <code id="rms">0</code></p>
    <script type="module" src="./engine-test.ts"></script>
  </body>
</html>
